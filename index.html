<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONEY BUDGET-OR</title>
    <link rel="stylesheet" href="money_budget-or.css">
</head>
<body>
    <h1>Money Budget-or</h1>
    <div id="container">
        <h3 id="message">Enter amount to calculate</h3>
        <p id="baseline" title="This is for your monthly baseline">Baseline: $200</p>
        <p id="savings" title="This is for your monthly savings">Savings: $100</p>
        <p id="investment" title="This is for your monthly investment">Investment: $60</p>
        <p id="self-satiation" title="This is for keeping your sanity😁">Self-Satiation: $40</p>
        <input type="number" id="amount" placeholder="400" min="10" title="Enter amount here" >
        <button type="submit" id="myBtn" title="press to calculate">Calculate</button>
    </div>
    
    <script src="money_budget-or.js"></script>
</body>
</html>
